version: 2

sources:
  - name: raw 
    database: WALMART
    schema: RAW 
    tables:
      - name: sales # renamed to sales to better fit the contents of the data
        identifier: department # source table name 
        description: "Weekly sales by store / department / data -- actual sales grain (source department.csv)"
      - name: stores 
        description: "Store attributes -- type and size of store (source stores.csv)"
      - name: features
        identifier: fact
        description: "Weekly conditions by store / date -- temperature, fuel, CPI, markdowns (source fact.csv)"